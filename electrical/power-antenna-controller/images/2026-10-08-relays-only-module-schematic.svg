<text x="240" y="727" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" font-style="normal" fill="#000">Relays: JQC-3FF 12 V changeover (COM = 30, NO = 87, NC = 87a), or Omron G5LE / mini ISO; each coil needs a 1N4007 (stripe to 85). D1: 1N4007. D2, D3: 1N5408. Pin 5 (R) only feeds the timer.</text>
<text x="240" y="745" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" font-style="normal" fill="#000">* Timer output: NO on a one-shot module (relay on at power-up, off after T), NC on a delay-on module (relay off at power-up, on after T).</text>
<text x="240" y="763" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" font-style="italic" fill="#000">Untested idea: check the antenna and the radio output first (see the README).</text>
